# Site settings. Restart `bundle exec jekyll serve` after editing; this file is not hot-reloaded.

title: Nectar Flow Finance
email: social@nectarflowfinance.com
description: >-
  A simple, minimalist finance blog focused on wealth building,
  personal finance, and investment strategies for everyday people.
baseurl: ""
url: "https://nectarflowfinance.com"
bluesky_username: nectarflow.bsky.social
github_username: jaidenamari
google_analytics: G-JFYDFCDB7R

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - github-pages

# Collections
collections:
  categories:
    output: true
    permalink: /category/:name/

# Custom settings
show_excerpts: true

# Pages linked in the header after Articles and Tools. Pages not listed here stay out of the nav.
header_pages:
  - about.md

# Repository files that are not site content. Setting this replaces Jekyll's defaults,
# so they are listed here too.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - .sass-cache
  - .jekyll-cache
